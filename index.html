<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emulador de Telefone Multi-Instâncias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Roboto', sans-serif;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .phone-screen {
      aspect-ratio: 9 / 19.5;
    }
    .wallpaper-1 { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
    .wallpaper-2 { background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%); }
    .wallpaper-3 { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); }
    .wallpaper-4 { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }

    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }
    .boot-pulse {
      animation: pulse-fast 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header / Control Bar -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-500/20 p-2.5 rounded-xl text-emerald-400 border border-emerald-500/30">
          <i class="fa-brands fa-android text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide text-slate-100 flex items-center gap-2">
            Emulador de Telefone Multi-Instâncias
          </h1>
          <p class="text-xs text-slate-400">Master → Replica Sincronizada em Tempo Real</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center flex-wrap gap-3">
        <!-- Instance Selector Presets -->
        <div class="bg-slate-900/80 p-1 rounded-lg border border-slate-700/80 flex items-center gap-1">
          <span class="text-xs text-slate-400 px-2 font-medium">Qtd:</span>
          <button onclick="setInstanceCount(1)" class="px-2.5 py-1 text-xs rounded font-semibold transition bg-slate-800 hover:bg-slate-700 text-slate-200">1x</button>
          <button onclick="setInstanceCount(2)" class="px-2.5 py-1 text-xs rounded font-semibold transition bg-slate-800 hover:bg-slate-700 text-slate-200">2x</button>
          <button onclick="setInstanceCount(3)" class="px-2.5 py-1 text-xs rounded font-semibold transition bg-slate-800 hover:bg-slate-700 text-slate-200">3x</button>
          <button onclick="setInstanceCount(4)" class="px-2.5 py-1 text-xs rounded font-semibold transition bg-slate-800 hover:bg-slate-700 text-slate-200">4x</button>
        </div>

        <!-- Add/Remove buttons -->
        <div class="flex items-center gap-1 bg-slate-900/80 p-1 rounded-lg border border-slate-700/80">
          <button onclick="removeDevice()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-red-400 transition" title="Remover Celular">
            <i class="fa-solid fa-minus text-sm"></i>
          </button>
          <span id="device-count-badge" class="px-2 text-xs font-bold text-emerald-400">1 Aparelhos</span>
          <button onclick="addDevice()" class="p-1.5 hover:bg-slate-800 rounded text-slate-300 hover:text-emerald-400 transition" title="Adicionar Celular">
            <i class="fa-solid fa-plus text-sm"></i>
          </button>
        </div>

        <!-- Regenerate Data -->
        <button onclick="regenerateAllDeviceData()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow-sm">
          <i class="fa-solid fa-dice text-sm"></i>
          <span>Gerar Novos IPs / MECs</span>
        </button>

        <!-- Sync Toggle -->
        <button id="sync-toggle-btn" onclick="toggleSync()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow-sm">
          <i id="sync-icon" class="fa-solid fa-arrows-rotate text-sm"></i>
          <span id="sync-text">Sincronização Ativa</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Work Area -->
  <main class="flex-1 p-6 max-w-[1600px] mx-auto w-full flex flex-col justify-center">
    <div id="devices-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 justify-items-center items-start">
      <!-- Phone instances will be injected here via JS -->
    </div>
  </main>

  <script>
    // System State
    const state = {
      instanceCount: 1,
      isSyncActive: true,
      currentApp: 'home', // 'home', 'messages', 'gallery', 'settings', 'chrome', 'phone'
      wallpaper: 'wallpaper-1',
      isDarkMode: true,
      clockTime: '',
      clockDate: '',
      notificationOpen: false,
      
      // Device States and Hardware Identities
      deviceData: [],

      // App Internal States
      chromeUrl: 'https://www.google.com',
      searchQuery: '',
      messages: [
        { sender: 'contato', text: 'Olá! O sistema Android está sincronizado?' },
        { sender: 'me', text: 'Sim, todas as instâncias conectadas!' }
      ],
      chatInput: '',
      dialpadNumber: ''
    };

    const bootMessages = [
      "Inicializando Kernel Android...",
      "Configurando Hardware Virtual...",
      "Alocando Endereço IP Público...",
      "Registrando Identificador MEC / IMEI...",
      "Sincronizando Módulos de GPS...",
      "Carregando Interface Material You..."
    ];

    const publicIpRanges = ['177', '186', '189', '200', '201'];
    const locations = [
      { city: 'São Paulo, BR', lat: '-23.5505', lng: '-46.6333' },
      { city: 'Rio de Janeiro, BR', lat: '-22.9068', lng: '-43.1729' },
      { city: 'Brasília, BR', lat: '-15.7801', lng: '-47.9292' },
      { city: 'Salvador, BR', lat: '-12.9777', lng: '-38.5016' },
      { city: 'Belo Horizonte, BR', lat: '-19.9167', lng: '-43.9345' },
      { city: 'Curitiba, BR', lat: '-25.4284', lng: '-49.2733' },
      { city: 'Miami, US', lat: '25.7617', lng: '-80.1918' },
      { city: 'Lisboa, PT', lat: '38.7223', lng: '-9.1393' }
    ];

    function generatePublicIP() {
      const first = publicIpRanges[Math.floor(Math.random() * publicIpRanges.length)];
      const second = Math.floor(Math.random() * 254) + 1;
      const third = Math.floor(Math.random() * 254) + 1;
      const fourth = Math.floor(Math.random() * 254) + 1;
      return `${first}.${second}.${third}.${fourth}`;
    }

    function generateMEC() {
      let mec = '35';
      for (let i = 0; i < 13; i++) {
        mec += Math.floor(Math.random() * 10);
      }
      return mec;
    }

    function getRandomLocation() {
      return locations[Math.floor(Math.random() * locations.length)];
    }

    function generateDeviceIdentity(index) {
      return {
        ip: generatePublicIP(),
        mec: generateMEC(),
        location: getRandomLocation(),
        isBooting: false,
        bootProgress: 100,
        bootStatusText: 'Pronto'
      };
    }

    function startBootSequence(index, delayOffset = 0) {
      if (!state.deviceData[index]) {
        state.deviceData[index] = generateDeviceIdentity(index);
      }
      
      const dev = state.deviceData[index];
      dev.isBooting = true;
      dev.bootProgress = 0;
      dev.bootStatusText = bootMessages[0];
      
      setTimeout(() => {
        renderDevices();
        let currentStep = 0;
        
        const interval = setInterval(() => {
          currentStep++;
          dev.bootProgress = Math.min(100, Math.round((currentStep / bootMessages.length) * 100));
          
          if (currentStep < bootMessages.length) {
            dev.bootStatusText = bootMessages[currentStep];
            renderDevices();
          } else {
            clearInterval(interval);
            dev.isBooting = false;
            dev.bootStatusText = 'Pronto';
            renderDevices();
          }
        }, 600);
      }, delayOffset);
    }

    function initData() {
      for (let i = 0; i < 8; i++) {
        state.deviceData.push(generateDeviceIdentity(i));
      }
      updateClock();
      setInterval(updateClock, 1000);
    }

    function updateClock() {
      const now = new Date();
      state.clockTime = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      state.clockDate = now.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
      
      document.querySelectorAll('.status-clock').forEach(el => el.textContent = state.clockTime);
      document.querySelectorAll('.home-clock').forEach(el => el.textContent = state.clockTime);
      document.querySelectorAll('.home-date').forEach(el => el.textContent = state.clockDate);
    }

    function regenerateAllDeviceData() {
      state.deviceData = state.deviceData.map((_, i) => generateDeviceIdentity(i));
      renderDevices();
    }

    function regenerateSingleDeviceData(index) {
      state.deviceData[index] = generateDeviceIdentity(index);
      renderDevices();
    }

    function updateDeviceLocation(index, locationIndex) {
      const selectedLoc = locations[locationIndex];
      if (index === 0 && state.isSyncActive) {
        state.deviceData.forEach(dev => dev.location = selectedLoc);
      } else {
        state.deviceData[index].location = selectedLoc;
      }
      renderDevices();
    }

    function addDevice() {
      if (state.instanceCount < 8) {
        const newIdx = state.instanceCount;
        state.instanceCount++;
        startBootSequence(newIdx, 0);
        renderDevices();
      }
    }

    function removeDevice() {
      if (state.instanceCount > 1) {
        state.instanceCount--;
        renderDevices();
      }
    }

    function setInstanceCount(count) {
      const oldCount = state.instanceCount;
      state.instanceCount = count;
      
      if (count > oldCount) {
        for (let i = oldCount; i < count; i++) {
          startBootSequence(i, (i - oldCount) * 1200);
        }
      }
      renderDevices();
    }

    function toggleSync() {
      state.isSyncActive = !state.isSyncActive;
      const btn = document.getElementById('sync-toggle-btn');
      const text = document.getElementById('sync-text');
      const icon = document.getElementById('sync-icon');

      if (state.isSyncActive) {
        btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow-sm";
        text.textContent = "Sincronização Ativa";
        icon.className = "fa-solid fa-arrows-rotate text-sm";
      } else {
        btn.className = "bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow-sm";
        text.textContent = "Sincronização Pausada";
        icon.className = "fa-solid fa-pause text-sm";
      }
    }

    function triggerAction(actionName, payload = null) {
      if (actionName === 'openApp') {
        state.currentApp = payload;
        state.notificationOpen = false;
      } else if (actionName === 'goHome') {
        state.currentApp = 'home';
        state.notificationOpen = false;
      } else if (actionName === 'toggleNotification') {
        state.notificationOpen = !state.notificationOpen;
      } else if (actionName === 'setWallpaper') {
        state.wallpaper = payload;
      } else if (actionName === 'toggleDarkMode') {
        state.isDarkMode = !state.isDarkMode;
      } else if (actionName === 'updateChatInput') {
        state.chatInput = payload;
      } else if (actionName === 'sendMessage') {
        if (state.chatInput.trim() !== '') {
          state.messages.push({ sender: 'me', text: state.chatInput });
          state.chatInput = '';
        }
      } else if (actionName === 'updateSearchQuery') {
        state.searchQuery = payload;
      } else if (actionName === 'updateChromeUrl') {
        state.chromeUrl = payload;
      } else if (actionName === 'dialAdd') {
        state.dialpadNumber += payload;
      } else if (actionName === 'dialDelete') {
        state.dialpadNumber = state.dialpadNumber.slice(0, -1);
      }

      renderDevices();
    }

    function handleMasterAction(actionName, payload = null, deviceIndex = 0) {
      if (deviceIndex === 0 && state.isSyncActive) {
        triggerAction(actionName, payload);
      } else {
        triggerAction(actionName, payload);
      }
    }

    function renderDevices() {
      document.getElementById('device-count-badge').textContent = `${state.instanceCount} Aparelhos`;
      const container = document.getElementById('devices-container');
      container.innerHTML = '';

      for (let i = 0; i < state.instanceCount; i++) {
        const isMaster = (i === 0);
        const deviceData = state.deviceData[i] || generateDeviceIdentity(i);
        const phoneHtml = createPhoneMarkup(i, isMaster, deviceData);
        container.insertAdjacentHTML('beforeend', phoneHtml);
      }
    }

    function createPhoneMarkup(index, isMaster, deviceData) {
      const isBooting = deviceData.isBooting;

      return `
        <div class="flex flex-col items-center gap-2">
          <!-- Top Info Bar -->
          <div class="flex items-center justify-between w-[280px] px-2 py-1 bg-slate-800/80 border border-slate-700/80 rounded-lg text-xs font-mono text-slate-300 shadow-sm">
            <span class="flex items-center gap-1.5 font-bold ${isMaster ? 'text-amber-400' : 'text-emerald-400'}">
              <i class="fa-solid ${isMaster ? 'fa-crown' : 'fa-mobile-screen-button'}"></i>
              ${isMaster ? 'MASTER (#1)' : `REPLICA (#${index + 1})`}
            </span>
            <div class="flex items-center gap-1.5">
              <button onclick="regenerateSingleDeviceData(${index})" title="Regerar Dados" class="text-slate-400 hover:text-indigo-400">
                <i class="fa-solid fa-arrows-rotate text-[11px]"></i>
              </button>
              <span class="text-[10px] bg-slate-900 border border-slate-700 px-1.5 py-0.5 rounded ${isBooting ? 'text-amber-400 animate-pulse' : 'text-slate-400'}">
                ${isBooting ? 'INICIALIZANDO' : (state.isSyncActive ? 'SYNC ON' : 'SYNC OFF')}
              </span>
            </div>
          </div>

          <!-- Network Data Header Banner -->
          <div class="w-[280px] bg-slate-800/90 border border-slate-700 rounded-lg p-2 text-[10px] space-y-1 font-mono text-slate-300">
            <div class="flex justify-between items-center">
              <span class="text-slate-400">IP Público:</span>
              <span class="text-indigo-300 font-bold">${isBooting ? '...' : deviceData.ip}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-400">MEC / IMEI:</span>
              <span class="text-emerald-300">${isBooting ? '...' : deviceData.mec}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-400">GPS:</span>
              <select onchange="updateDeviceLocation(${index}, this.value)" ${isBooting ? 'disabled' : ''} class="bg-slate-900 border border-slate-700 text-slate-200 text-[10px] rounded px-1 py-0.5 outline-none focus:border-indigo-500">
                ${locations.map((loc, lIdx) => `
                  <option value="${lIdx}" ${loc.city === deviceData.location.city ? 'selected' : ''}>${loc.city}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <!-- Phone Outer Shell -->
          <div class="phone-screen w-[280px] bg-slate-950 border-[6px] border-slate-700/80 rounded-[40px] shadow-2xl relative overflow-hidden flex flex-col ring-1 ring-slate-600/30">
            
            <!-- Camera Notch -->
            <div class="absolute top-2 left-1/2 -translate-x-1/2 w-16 h-4 bg-black rounded-full z-40 flex items-center justify-center gap-2">
              <div class="w-2 h-2 rounded-full bg-slate-900 border border-slate-800"></div>
              <div class="w-1.5 h-1.5 rounded-full bg-blue-900/60"></div>
            </div>

            <!-- Status Bar -->
            <div onclick="handleMasterAction('toggleNotification', null, ${index})" class="h-7 pt-2 px-6 flex items-center justify-between text-[11px] text-white z-30 cursor-pointer hover:bg-white/5 transition">
              <span class="status-clock font-medium tracking-tight">${state.clockTime}</span>
              <div class="flex items-center space-x-1.5 text-[10px]">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-battery-three-quarters text-xs"></i>
              </div>
            </div>

            <!-- Screen Body (Wallpaper / Dark mode / Boot Screen) -->
            <div class="flex-1 relative flex flex-col overflow-hidden ${state.wallpaper} ${state.isDarkMode ? 'text-slate-100' : 'text-slate-900'}">
              
              ${isBooting ? renderBootScreen(deviceData) : `
                <!-- Content App Display -->
                <div class="flex-1 overflow-y-auto custom-scrollbar relative">
                  ${renderAppContent(index)}
                </div>

                <!-- Quick Settings / Notification Shade Overlay -->
                ${state.notificationOpen ? renderNotificationPanel(index) : ''}
              `}

            </div>

            <!-- Bottom Navigation Bar -->
            <div class="h-8 bg-black/40 backdrop-blur-md border-t border-white/10 flex items-center justify-around px-8 z-30">
              <button onclick="handleMasterAction('goHome', null, ${index})" class="text-white/70 hover:text-white p-1">
                <i class="fa-solid fa-chevron-left text-xs"></i>
              </button>
              <button onclick="handleMasterAction('goHome', null, ${index})" class="text-white/70 hover:text-white p-1">
                <i class="fa-regular fa-circle text-xs"></i>
              </button>
              <button onclick="handleMasterAction('goHome', null, ${index})" class="text-white/70 hover:text-white p-1">
                <i class="fa-solid fa-square text-[10px]"></i>
              </button>
            </div>

          </div>
        </div>
      `;
    }

    function renderBootScreen(deviceData) {
      return `
        <div class="absolute inset-0 bg-black z-50 flex flex-col items-center justify-center p-6 text-center text-white">
          <div class="mb-6 text-emerald-400 boot-pulse">
            <i class="fa-brands fa-android text-5xl"></i>
          </div>
          
          <h3 class="text-xs font-semibold tracking-wider text-slate-200 mb-2">android</h3>
          
          <!-- Progress Bar -->
          <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden my-3 border border-slate-700">
            <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${deviceData.bootProgress}%"></div>
          </div>
          
          <p class="text-[10px] text-slate-400 font-mono mt-1">${deviceData.bootStatusText}</p>
        </div>
      `;
    }

    function renderAppContent(deviceIndex) {
      switch (state.currentApp) {
        case 'home':
          return renderHomeApp(deviceIndex);
        case 'messages':
          return renderMessagesApp(deviceIndex);
        case 'gallery':
          return renderGalleryApp(deviceIndex);
        case 'settings':
          return renderSettingsApp(deviceIndex);
        case 'chrome':
          return renderChromeApp(deviceIndex);
        case 'phone':
          return renderPhoneApp(deviceIndex);
        default:
          return renderHomeApp(deviceIndex);
      }
    }

    // HOME SCREEN APP
    function renderHomeApp(deviceIndex) {
      return `
        <div class="p-4 flex flex-col justify-between h-full text-white">
          <!-- Widget Clock -->
          <div class="mt-6 text-center drop-shadow">
            <h1 class="home-clock text-4xl font-light tracking-tight">${state.clockTime}</h1>
            <p class="home-date text-xs font-medium opacity-90 capitalize mt-1">${state.clockDate}</p>
          </div>

          <!-- Search Widget -->
          <div class="my-auto">
            <div class="bg-white/20 backdrop-blur-md border border-white/30 rounded-full px-3 py-1.5 flex items-center gap-2 shadow-sm">
              <i class="fa-brands fa-google text-xs opacity-80"></i>
              <input 
                type="text" 
                placeholder="Pesquisar..." 
                value="${state.searchQuery}"
                oninput="handleMasterAction('updateSearchQuery', this.value, ${deviceIndex})"
                class="bg-transparent text-xs w-full outline-none placeholder-white/70 text-white"
              >
              <i class="fa-solid fa-microphone text-xs opacity-80"></i>
            </div>
          </div>

          <!-- Grid App Icons -->
          <div class="grid grid-cols-4 gap-3 mb-2 text-center">
            <button onclick="handleMasterAction('openApp', 'messages', ${deviceIndex})" class="flex flex-col items-center gap-1 group">
              <div class="w-10 h-10 rounded-2xl bg-emerald-500 flex items-center justify-center text-white shadow-md group-active:scale-95 transition">
                <i class="fa-solid fa-comment text-base"></i>
              </div>
              <span class="text-[10px] drop-shadow font-medium">Mensagens</span>
            </button>

            <button onclick="handleMasterAction('openApp', 'gallery', ${deviceIndex})" class="flex flex-col items-center gap-1 group">
              <div class="w-10 h-10 rounded-2xl bg-purple-500 flex items-center justify-center text-white shadow-md group-active:scale-95 transition">
                <i class="fa-solid fa-image text-base"></i>
              </div>
              <span class="text-[10px] drop-shadow font-medium">Galeria</span>
            </button>

            <button onclick="handleMasterAction('openApp', 'chrome', ${deviceIndex})" class="flex flex-col items-center gap-1 group">
              <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-yellow-400 via-red-500 to-green-500 flex items-center justify-center text-white shadow-md group-active:scale-95 transition">
                <i class="fa-brands fa-chrome text-base"></i>
              </div>
              <span class="text-[10px] drop-shadow font-medium">Chrome</span>
            </button>

            <button onclick="handleMasterAction('openApp', 'phone', ${deviceIndex})" class="flex flex-col items-center gap-1 group">
              <div class="w-10 h-10 rounded-2xl bg-blue-500 flex items-center justify-center text-white shadow-md group-active:scale-95 transition">
                <i class="fa-solid fa-phone text-base"></i>
              </div>
              <span class="text-[10px] drop-shadow font-medium">Telefone</span>
            </button>

            <button onclick="handleMasterAction('openApp', 'settings', ${deviceIndex})" class="flex flex-col items-center gap-1 group">
              <div class="w-10 h-10 rounded-2xl bg-slate-600 flex items-center justify-center text-white shadow-md group-active:scale-95 transition">
                <i class="fa-solid fa-gear text-base"></i>
              </div>
              <span class="text-[10px] drop-shadow font-medium">Ajustes</span>
            </button>
          </div>
        </div>
      `;
    }

    // MESSAGES APP
    function renderMessagesApp(deviceIndex) {
      return `
        <div class="h-full flex flex-col bg-slate-900 text-slate-100">
          <div class="p-3 bg-slate-800 border-b border-slate-700 flex items-center gap-2">
            <button onclick="handleMasterAction('goHome', null, ${deviceIndex})" class="p-1 hover:bg-slate-700 rounded">
              <i class="fa-solid fa-arrow-left text-xs"></i>
            </button>
            <div class="w-6 h-6 rounded-full bg-indigo-500 flex items-center justify-center text-[10px] font-bold">
              C
            </div>
            <div>
              <h2 class="text-xs font-semibold">Contato</h2>
              <p class="text-[9px] text-emerald-400">Online</p>
            </div>
          </div>

          <div class="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
            ${state.messages.map(m => `
              <div class="flex ${m.sender === 'me' ? 'justify-end' : 'justify-start'}">
                <div class="${m.sender === 'me' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200'} rounded-xl px-3 py-1.5 max-w-[80%] text-[11px] shadow-sm">
                  ${m.text}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="p-2 bg-slate-800 border-t border-slate-700 flex items-center gap-1">
            <input 
              type="text" 
              placeholder="Digite uma mensagem..." 
              value="${state.chatInput}"
              oninput="handleMasterAction('updateChatInput', this.value, ${deviceIndex})"
              onkeydown="if(event.key === 'Enter') handleMasterAction('sendMessage', null, ${deviceIndex})"
              class="flex-1 bg-slate-900 border border-slate-700 text-xs rounded-full px-3 py-1.5 text-slate-100 outline-none focus:border-indigo-500"
            >
            <button onclick="handleMasterAction('sendMessage', null, ${deviceIndex})" class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-500 transition">
              <i class="fa-solid fa-paper-plane text-[10px]"></i>
            </button>
          </div>
        </div>
      `;
    }

    // GALLERY APP
    function renderGalleryApp(deviceIndex) {
      return `
        <div class="h-full flex flex-col bg-slate-950 text-slate-100">
          <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <button onclick="handleMasterAction('goHome', null, ${deviceIndex})" class="p-1 hover:bg-slate-800 rounded">
                <i class="fa-solid fa-arrow-left text-xs"></i>
              </button>
              <h2 class="text-xs font-semibold">Galeria de Fotos</h2>
            </div>
            <i class="fa-solid fa-ellipsis-vertical text-xs text-slate-400"></i>
          </div>

          <div class="p-2 grid grid-cols-3 gap-1 overflow-y-auto">
            <div class="aspect-square bg-gradient-to-br from-indigo-500 to-purple-600 rounded flex items-center justify-center text-white text-xs">
              <i class="fa-solid fa-mountain"></i>
            </div>
            <div class="aspect-square bg-gradient-to-br from-pink-500 to-rose-500 rounded flex items-center justify-center text-white text-xs">
              <i class="fa-solid fa-sun"></i>
            </div>
            <div class="aspect-square bg-gradient-to-br from-emerald-400 to-teal-600 rounded flex items-center justify-center text-white text-xs">
              <i class="fa-solid fa-tree"></i>
            </div>
            <div class="aspect-square bg-gradient-to-br from-amber-400 to-orange-500 rounded flex items-center justify-center text-white text-xs">
              <i class="fa-solid fa-building"></i>
            </div>
            <div class="aspect-square bg-gradient-to-br from-blue-500 to-cyan-400 rounded flex items-center justify-center text-white text-xs">
              <i class="fa-solid fa-water"></i>
            </div>
            <div class="aspect-square bg-gradient-to-br from-fuchsia-600 to-pink-500 rounded flex items-center justify-center text-white text-xs">
              <i class="fa-solid fa-camera"></i>
            </div>
          </div>
        </div>
      `;
    }

    // SETTINGS APP
    function renderSettingsApp(deviceIndex) {
      const dev = state.deviceData[deviceIndex] || generateDeviceIdentity(deviceIndex);
      return `
        <div class="h-full flex flex-col bg-slate-900 text-slate-100">
          <div class="p-3 bg-slate-800 border-b border-slate-700 flex items-center gap-2">
            <button onclick="handleMasterAction('goHome', null, ${deviceIndex})" class="p-1 hover:bg-slate-700 rounded">
              <i class="fa-solid fa-arrow-left text-xs"></i>
            </button>
            <h2 class="text-xs font-semibold">Configurações do Sistema</h2>
          </div>

          <div class="p-3 space-y-4 overflow-y-auto text-xs">
            <div>
              <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider mb-2">Aparência & Tela</p>
              <div class="space-y-2">
                <p class="text-[11px] text-slate-300">Papel de Parede:</p>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="handleMasterAction('setWallpaper', 'wallpaper-1', ${deviceIndex})" class="h-8 rounded border border-slate-600 wallpaper-1 text-[10px] font-medium text-white flex items-center justify-center">Azul</button>
                  <button onclick="handleMasterAction('setWallpaper', 'wallpaper-2', ${deviceIndex})" class="h-8 rounded border border-slate-600 wallpaper-2 text-[10px] font-medium text-white flex items-center justify-center">Sunset</button>
                  <button onclick="handleMasterAction('setWallpaper', 'wallpaper-3', ${deviceIndex})" class="h-8 rounded border border-slate-600 wallpaper-3 text-[10px] font-medium text-white flex items-center justify-center">Verde</button>
                  <button onclick="handleMasterAction('setWallpaper', 'wallpaper-4', ${deviceIndex})" class="h-8 rounded border border-slate-600 wallpaper-4 text-[10px] font-medium text-white flex items-center justify-center">Dark</button>
                </div>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-800">
              <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider mb-2">Identidade Hardware</p>
              <div class="bg-slate-800 p-2.5 rounded border border-slate-700 space-y-1.5 text-[10px] font-mono">
                <div class="flex justify-between">
                  <span class="text-slate-400">IP Público:</span>
                  <span class="text-indigo-300 font-bold">${dev.ip}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">Nº MEC / IMEI:</span>
                  <span class="text-emerald-300">${dev.mec}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">GPS City:</span>
                  <span class="text-amber-300">${dev.location.city}</span>
                </div>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-800">
              <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider mb-2">Sobre o Dispositivo</p>
              <div class="bg-slate-800 p-2 rounded text-[10px] space-y-1 text-slate-300">
                <p><strong>Modelo:</strong> Android Device X1</p>
                <p><strong>Versão:</strong> Android 14 (API 34)</p>
                <p><strong>Compilação:</strong> UP1A.231005.007</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // CHROME APP
    function renderChromeApp(deviceIndex) {
      return `
        <div class="h-full flex flex-col bg-slate-900 text-slate-100">
          <div class="p-2 bg-slate-800 border-b border-slate-700 flex items-center gap-1.5">
            <button onclick="handleMasterAction('goHome', null, ${deviceIndex})" class="p-1 hover:bg-slate-700 rounded text-slate-300">
              <i class="fa-solid fa-house text-xs"></i>
            </button>
            <div class="flex-1 bg-slate-900 border border-slate-700 rounded-full px-2.5 py-1 flex items-center gap-1.5">
              <i class="fa-solid fa-lock text-[9px] text-emerald-400"></i>
              <input 
                type="text" 
                value="${state.chromeUrl}"
                oninput="handleMasterAction('updateChromeUrl', this.value, ${deviceIndex})"
                class="bg-transparent text-[11px] w-full outline-none text-slate-200"
              >
            </div>
          </div>

          <div class="flex-1 p-3 bg-slate-950 overflow-y-auto text-xs space-y-3">
            <div class="text-center py-4">
              <i class="fa-brands fa-google text-3xl text-indigo-400 mb-2"></i>
              <h3 class="text-xs font-semibold">Navegador Web</h3>
              <p class="text-[10px] text-slate-400 mt-1">Conexão Segura Ativa</p>
            </div>

            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800 space-y-1.5">
              <h4 class="text-[11px] font-semibold text-indigo-300">Status da Conexão</h4>
              <p class="text-[10px] text-slate-400">Navegação associada ao IP Público: <span class="text-emerald-400 font-mono">${(state.deviceData[deviceIndex] || {}).ip}</span></p>
            </div>
          </div>
        </div>
      `;
    }

    // PHONE DIALER APP
    function renderPhoneApp(deviceIndex) {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'];
      return `
        <div class="h-full flex flex-col bg-slate-900 text-slate-100">
          <div class="p-3 border-b border-slate-800 flex items-center gap-2">
            <button onclick="handleMasterAction('goHome', null, ${deviceIndex})" class="p-1 hover:bg-slate-800 rounded">
              <i class="fa-solid fa-arrow-left text-xs"></i>
            </button>
            <h2 class="text-xs font-semibold">Telefone</h2>
          </div>

          <div class="p-4 text-center">
            <span class="text-lg font-mono tracking-wider min-h-[28px] block text-indigo-400">${state.dialpadNumber || '&nbsp;'}</span>
          </div>

          <div class="flex-1 grid grid-cols-3 gap-2 px-6 pb-4">
            ${keys.map(k => `
              <button onclick="handleMasterAction('dialAdd', '${k}', ${deviceIndex})" class="aspect-square rounded-full bg-slate-800 hover:bg-slate-700 text-sm font-semibold flex items-center justify-center transition active:scale-95">
                ${k}
              </button>
            `).join('')}
          </div>

          <div class="pb-4 flex justify-center items-center gap-4">
            <button onclick="handleMasterAction('dialDelete', null, ${deviceIndex})" class="p-2 text-slate-400 hover:text-red-400">
              <i class="fa-solid fa-backspace text-sm"></i>
            </button>
            <button class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-lg active:scale-95">
              <i class="fa-solid fa-phone text-sm"></i>
            </button>
          </div>
        </div>
      `;
    }

    // QUICK SETTINGS / NOTIFICATION PANEL
    function renderNotificationPanel(deviceIndex) {
      return `
        <div class="absolute inset-0 bg-slate-950/90 backdrop-blur-md z-50 p-4 flex flex-col justify-between text-white animate-fade-in">
          <div>
            <div class="flex justify-between items-center mb-4">
              <span class="text-xs font-medium text-slate-400">${state.clockDate}</span>
              <button onclick="handleMasterAction('toggleNotification', null, ${deviceIndex})" class="text-xs text-slate-400 p-1">
                <i class="fa-solid fa-xmark text-sm"></i>
              </button>
            </div>

            <!-- Quick Toggles Grid -->
            <div class="grid grid-cols-4 gap-2 mb-4">
              <button class="flex flex-col items-center gap-1 p-2 rounded-xl bg-indigo-600 text-white">
                <i class="fa-solid fa-wifi text-xs"></i>
                <span class="text-[9px]">Wi-Fi</span>
              </button>
              <button class="flex flex-col items-center gap-1 p-2 rounded-xl bg-indigo-600 text-white">
                <i class="fa-solid fa-bluetooth text-xs"></i>
                <span class="text-[9px]">Bluetooth</span>
              </button>
              <button class="flex flex-col items-center gap-1 p-2 rounded-xl bg-slate-800 text-slate-400">
                <i class="fa-solid fa-lightbulb text-xs"></i>
                <span class="text-[9px]">Lanterna</span>
              </button>
              <button onclick="handleMasterAction('toggleDarkMode', null, ${deviceIndex})" class="flex flex-col items-center gap-1 p-2 rounded-xl ${state.isDarkMode ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}">
                <i class="fa-solid fa-moon text-xs"></i>
                <span class="text-[9px]">Escuro</span>
              </button>
            </div>

            <!-- Notification Cards -->
            <div class="space-y-2">
              <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800 text-[10px]">
                <div class="flex items-center justify-between text-slate-400 mb-1">
                  <span>Sistema Android</span>
                  <span>Agora</span>
                </div>
                <p class="font-medium text-slate-200">Sincronização Ativa com Dispositivo Master</p>
              </div>
            </div>
          </div>

          <div class="text-center pt-2">
            <button onclick="handleMasterAction('toggleNotification', null, ${deviceIndex})" class="text-[10px] text-indigo-400">
              Fechar Painel
            </button>
          </div>
        </div>
      `;
    }

    // Initialize
    initData();
    renderDevices();
  </script>
</body>
</html>
